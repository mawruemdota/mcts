name: Ad Studio checks
on:
  push:
    paths:
      - "src/components/creativehub/**"
      - "src/pages/CreativeHub.jsx"
      - "api/facebook-posts.js"
      - "tests/adEngine.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ad-studio-check.yml"
  pull_request:
    paths:
      - "src/components/creativehub/**"
      - "src/pages/CreativeHub.jsx"
      - "api/facebook-posts.js"
      - "tests/adEngine.test.mjs"
      - "package.json"
      - "package-lock.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/adEngine.test.mjs
      - run: npm run build
