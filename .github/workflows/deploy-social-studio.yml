name: Deploy Social Studio to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: social-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean site
        uses: actions/checkout@v4
      - name: Verify browser modules
        run: |
          node --check app.js
          node --check engine.mjs
          node --test tests/engine.test.mjs
      - name: Prepare minimal public artifact
        run: |
          mkdir -p public-site
          cp index.html app.js engine.mjs styles.css favicon.svg .nojekyll public-site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload clean public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
